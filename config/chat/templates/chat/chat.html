<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        /* Base page styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* The main chat window */
        #chat-container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* The scrollable area for messages */
        #chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Individual message bubble styling */
        .message {
            padding: 12px 16px;
            border-radius: 20px;
            max-width: 75%;
            word-wrap: break-word;
            line-height: 1.4;
        }

        /* User messages (Right side, Blue) */
        .user-msg {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* AI messages (Left side, Gray) */
        .ai-msg {
            background-color: #e9ecef;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* The input area at the bottom */
        #input-container {
            display: flex;
            padding: 15px;
            background: #fff;
            border-top: 1px solid #eaeaea;
        }

        /* The text box */
        #message-input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #ccc;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        #message-input:focus {
            border-color: #007bff;
        }

        /* The send button */
        #send-btn {
            padding: 10px 25px;
            margin-left: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #send-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <!-- Chat messages will appear here -->
        <div id="chat-log"></div>

        <!-- Input area -->
        <div id="input-container">
            <input type="text" id="message-input" placeholder="Type your message here..." autocomplete="off" onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // Get the conversation ID from the URL (e.g., from /chat/1/)
        const conversationId = window.location.pathname.split('/')[2];

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('message-input');
            const chatLog = document.getElementById('chat-log');
            const messageText = inputField.value.trim();

            if (messageText === "") return;

            // 1. Display User Message
            const userBubble = document.createElement('div');
            userBubble.classList.add('message', 'user-msg');
            userBubble.textContent = messageText;
            chatLog.appendChild(userBubble);
            
            // Clear input and scroll to bottom
            inputField.value = '';
            chatLog.scrollTop = chatLog.scrollHeight;

            // 2. Send to Django Backend
            try {
                // Ensure this URL matches your urls.py setup
                const response = await fetch(`/api/chat/${conversationId}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: messageText })
                });

                const data = await response.json();

                // 3. Display AI Message
                const aiBubble = document.createElement('div');
                aiBubble.classList.add('message', 'ai-msg');
                
                if (response.ok) {
                    aiBubble.textContent = data.response;
                } else {
                    aiBubble.textContent = "Error: " + (data.error || "Something went wrong.");
                    aiBubble.style.backgroundColor = "#ffdddd";
                    aiBubble.style.color = "#d8000c";
                }
                
                chatLog.appendChild(aiBubble);
                chatLog.scrollTop = chatLog.scrollHeight;

            } catch (error) {
                const errorBubble = document.createElement('div');
                errorBubble.classList.add('message', 'ai-msg');
                errorBubble.textContent = "Error: Could not reach the server.";
                errorBubble.style.backgroundColor = "#ffdddd";
                errorBubble.style.color = "#d8000c";
                chatLog.appendChild(errorBubble);
                chatLog.scrollTop = chatLog.scrollHeight;
            }
        }
    </script>
</body>
</html>
